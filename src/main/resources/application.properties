# Info
info.application.name=@project.name@
info.application.artifactId=@project.artifactId@
info.application.version=@project.version@
info.application.description=@project.description@
info.properties.environment=${ENV:azure}
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoints.jmx.exposure.include=health,info
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
# Openapi
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
# Server
# TODO: set your base path
server.servlet.context-path=/
server.port=8080
# Logging
logging.level.root=${DEFAULT_LOGGING_LEVEL:INFO}
logging.level.it.gov.pagopa=${APP_LOGGING_LEVEL:INFO}

#Azure Event Hubs
azure.eventhub.flowtx.connection-string=${EVENT_HUB_FLOWTX_CONNECTION_STRING}
azure.eventhub.flowtx.name=${EVENT_HUB_FLOWTX_NAME}

azure.eventhub.reportediuv.connection-string=${EVENT_HUB_REPORTEDIUV_CONNECTION_STRING}
azure.eventhub.reportediuv.name=${EVENT_HUB_REPORTEDIUV_NAME}

#Azure Blob Storage
azure.storage.connection-string=${BLOB_STORAGE_CONNECTION_STRING}
azure.storage.container.name=${BLOB_STORAGE_CONTAINER_NAME}

# CORS configuration
cors.configuration=${CORS_CONFIGURATION:{"origins": ["*"], "methods": ["*"]}}

